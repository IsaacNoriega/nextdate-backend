spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nextdate_db}
    username: ${DB_USERNAME:nextdate_admin}
    password: ${DB_PASSWORD:nextdate_secure_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    # 'validate' comprueba que tu código coincida con la base de datos sin alterarla accidentalmente
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  graphql:
    graphiql:
      enabled: true
    cors:
      allowed-origins: "https://studio.apollographql.com,http://localhost:8080,http://localhost:8081,http://localhost:19006,http://localhost:3000"

aws:
  bedrock:
    mock: ${AWS_BEDROCK_MOCK:true}
    model-id: ${AWS_BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
    region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

jwt:
  secret: ${JWT_SECRET:nextdate_super_secret_key_development_only_minimum_64_characters_long_for_security_compliance}
  expiration-ms: ${JWT_EXPIRATION_MS:864000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-none}]"